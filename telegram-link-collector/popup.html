<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Get Files URLs</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <p class="eyebrow">TELEGRAM WEB</p>
      <h1>Get Files URLs</h1>
      <p class="hint">Mở đúng group con, rồi quét các tin nhắn đã tải hoặc toàn bộ lịch sử.</p>
      <div class="actions">
        <button id="scanVisible" class="secondary">Quét phần đang hiển thị</button>
        <button id="scanHistory">Quét toàn bộ group con</button>
      </div>
      <p id="status" role="status" aria-live="polite">Sẵn sàng.</p>
      <textarea id="results" readonly aria-label="Danh sách URL"></textarea>
      <div class="footer-actions">
        <button id="copy" class="secondary" disabled>Sao chép</button>
        <button id="save" class="secondary" disabled>Lưu TXT</button>
      </div>
      <section class="bot-compare">
        <p class="eyebrow">ĐỐI CHIẾU BOT HIỆN TẠI</p>
        <p class="hint">Mở đúng chat bot, chọn file TXT gốc rồi quét lịch sử ngay tab này.</p>
        <input id="sourceFile" type="file" accept=".txt,text/plain">
        <button id="compareCurrentBot" disabled>Dò toàn bộ bot hiện tại</button>
        <button id="saveComparison" class="secondary" disabled>Xuất TXT khóa còn thiếu</button>
        <p id="compareStatus" class="compare-status" role="status" aria-live="polite">Chưa chọn file gốc.</p>
      </section>
      <button id="openRunner" class="runner">Xử lý danh sách TXT</button>
      <p class="privacy">Chỉ đọc liên kết trong tab hiện tại. Không đọc cookie hoặc token.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
